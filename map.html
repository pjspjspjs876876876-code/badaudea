function polygonShadow(coords,height,sun){if(sun.alt<=0)return null;const d=Math.min(height/Math.tan(rad(sun.alt)),260),east=Math.sin(rad(sun.az+180))*d,north=Math.cos(rad(sun.az+180))*d,a=coords.map(([lng,lat])=>[lat,lng]),b=a.map(p=>move(p[0],p[1],east,north));return hull([...a,...b]);}
function icon(kind){const symbol=kind==='tree'?'♣':kind==='shower'?'🚿':kind==='toilet'?'🚻':kind==='parking'?'P':kind==='attraction'?'★':'▣';return L.divIcon({className:'',html:`<div class="facility-icon ${kind==='tree'?'tree-icon':kind==='building'?'building-icon':''}">${symbol}</div>`,iconSize:[30,30],iconAnchor:[15,15]});}
function visible(f){const search=document.querySelector('#search').value.trim(),categories=f.categories||[f.category];return f.site===place&&(selected.has('전체')||categories.some(c=>selected.has(c)))&&f.name.includes(search);}
function showDetail(f){const shade=Boolean(f.height),kindName=f.kind==='shower'?'샤워장':f.kind==='toilet'?'화장실':f.kind==='parking'?'주차장':f.kind,note=shade?(f.demoHeight?'나무 높이는 현재 시연용 8m입니다. 실제 높이를 조사하면 바꿉니다.':'팀이 조사한 그늘 좌표를 사용했습니다.'):'등록된 위치 정보입니다.';document.querySelector('#detail').hidden=false;document.querySelector('#detail').innerHTML=`<div class="detail-top"><div><h2>${f.name}</h2><span class="tag">${f.category} · ${kindName}</span></div><button class="close" aria-label="닫기">×</button></div><div class="info"><div><span>현재 상태</span><strong>${shade?'예상 그늘 표시':'시설 위치 표시'}</strong></div><div><span>${shade?'구조물 높이':'이용요금'}</span><strong>${shade?`${f.height}m`:f.fee||'무료'}</strong></div><div><span>거리</span><strong>내 위치 확인 후 표시</strong></div><div><span>도보시간</span><strong>길찾기 연결 예정</strong></div></div><button class="route">길찾기 준비 중</button><p class="note">${note}</p>`;document.querySelector('.close').onclick=()=>document.querySelector('#detail').hidden=true;}
function chosenTime(){const date=document.querySelector('#shadeDate').value.split('-').map(Number),minutes=Number(document.querySelector('#shadeSlider').value);return new Date(date[0],date[1]-1,date[2],Math.floor(minutes/60),minutes%60);}
function render(){shadeLayer.clearLayers();facilityLayer.clearLayers();const when=chosenTime(),sun=solar(when,SITES[place].center[0],SITES[place].center[1]),showShade=selected.has('그늘');document.querySelector('#shadeTime').textContent=`${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')}`;document.querySelector('#sunStatus').textContent=sun.alt>0?`태양 고도 ${sun.alt.toFixed(1)}° · 검은 영역은 선택한 시각의 예상 그림자입니다.`:'해가 진 시간입니다. 그림자를 표시하지 않습니다.';SHAPES.filter(s=>s.site===place).forEach(s=>{const footprint=displayFootprint(s),shadow=showShade?polygonShadow(footprint.map(([lat,lng])=>[lng,lat]),s.height,sun):null;if(shadow)L.polygon(shadow,{color:'#263238',weight:1,fillColor:'#263238',fillOpacity:.48,interactive:false}).addTo(shadeLayer);const f=FACILITIES.find(x=>x.name===s.name&&x.site===s.site);L.polygon(footprint,{color:'#8da98c',weight:1,fillColor:'#c7d7c7',fillOpacity:.42}).bindTooltip(s.name).on('click',()=>showDetail(f)).addTo(facilityLayer);});TREES.filter(t=>t.site===place).forEach(t=>{const shadow=showShade&&sun.alt>0?move(t.lat,t.lng,Math.sin(rad(sun.az+180))*Math.min(t.height/Math.tan(rad(sun.alt)),55),Math.cos(rad(sun.az+180))*Math.min(t.height/Math.tan(rad(sun.alt)),55)):null;if(shadow)L.polyline([[t.lat,t.lng],shadow],{color:'#263238',weight:11,opacity:.48,lineCap:'round',interactive:false}).addTo(shadeLayer);const f=FACILITIES.find(x=>x.name===t.name&&x.site===t.site);if(visible(f))L.marker([t.lat,t.lng],{icon:icon('tree')}).bindTooltip(t.name).on('click',()=>showDetail(f)).addTo(facilityLayer);});POINTS.filter(p=>visible(p)).forEach(p=>L.marker(p.point,{icon:icon(p.kind)}).bindTooltip(p.name).on('click',()=>showDetail(p)).addTo(facilityLayer));}
function buildChips(){document.querySelector('#chips').innerHTML=CATEGORIES.map(c=>`<button class="chip ${selected.has(c)?'active':''}" data-category="${c}">${c}</button>`).join('');document.querySelector('#shadeControls').hidden=!selected.has('그늘');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.category;if(c==='전체'){selected=new Set(['전체']);}else{selected.delete('전체');selected.has(c)?selected.delete(c):selected.add(c);if(!selected.size)selected.add('전체');}buildChips();render();});}
const start=new Date(),dateField=document.querySelector('#shadeDate'),slider=document.querySelector('#shadeSlider');dateField.value=start.toISOString().slice(0,10);slider.value=Math.round((start.getHours()*60+start.getMinutes())/5)*5;dateField.onchange=render;slider.oninput=render;document.querySelector('#now').onclick=()=>{const now=new Date();dateField.value=now.toISOString().slice(0,10);slider.value=Math.round((now.getHours()*60+now.getMinutes())/5)*5;render();};
map=L.map('map',{zoomControl:false}).setView([35.156,129.139],12);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);shadeLayer=L.layerGroup().addTo(map);facilityLayer=L.layerGroup().addTo(map);buildChips();render();document.querySelectorAll('.place').forEach(b=>b.onclick=()=>{place=b.dataset.place;document.querySelectorAll('.place').forEach(x=>x.classList.toggle('active',x===b));map.flyTo(SITES[place].center,SITES[place].zoom);document.querySelector('#detail').hidden=true;render();});document.querySelectorAll('[data-entry-place]').forEach(b=>b.onclick=()=>{place=b.dataset.entryPlace;document.querySelectorAll('.place').forEach(x=>x.classList.toggle('active',x.dataset.place===place));document.querySelector('#detail').hidden=true;render();map.flyTo(SITES[place].center,SITES[place].zoom,{duration:2.2});document.querySelector('#placeGate').classList.add('hide');});document.querySelector('#search').oninput=render;document.querySelector('#locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(c,{radius:8,color:'#fff',weight:3,fillColor:'#ef4937',fillOpacity:1}).addTo(map).bindTooltip('내 위치',{permanent:true,direction:'top'});map.flyTo(c,16);},()=>alert('브라우저에서 위치 권한을 허용해 주세요.'));

<script>
  (()=>{
    var appLanguage=localStorage.getItem('badaEodiLang')||'ko',plannedRoute=null;
    var mapCopy={ko:{ko:'한국어',en:'English',locate:'현재 위치',plan:'하루 경로',planTitle:'해안 관광 하루 코스',planLead:'출발 주차장과 해변 또는 관광명소를 고르면, 다시 주차장으로 돌아오는 순서를 추천합니다.',parking:'출발 주차장',destination:'해변 또는 관광명소',beach:'해변',build:'경로 만들기',cancel:'경로 취소',distance:'예상 도보 거리',time:'예상 도보 시간',notice:'※ 현재는 시설 위치를 잇는 시연용 경로입니다. 실제 도보 길은 길찾기 API 연결 후 적용할 수 있습니다.',choose:'관광지 선택',info:'보고 싶은 정보를 골라 보세요.',search:'시설 이름 검색',shade:'날짜와 시간에 따른 그늘',all:'전체'},en:{ko:'한국어',en:'English',locate:'My location',plan:'Day route',planTitle:'Beach day planner',planLead:'Choose a starting parking lot and a beach or attraction. We will suggest a return-to-parking itinerary.',parking:'Starting parking',destination:'Beach or attraction',beach:'Beach',build:'Build route',cancel:'Clear route',distance:'Estimated walking distance',time:'Estimated walking time',notice:'Demo route: this connects facility locations. Road-based walking directions can be added after a routing API is connected.',choose:'Choose area',info:'Choose what to show',search:'Search facilities',shade:'Shade by date and time',all:'All'}};
    function catLabel(c){if(appLanguage!=='en')return c;return({'전체':'All','주차장':'Parking','샤워시설':'Showers','세족장':'Foot wash','족욕장':'Foot bath','화장실':'Restrooms','그늘':'Shade','안전시설':'Safety','관광명소':'Attractions'})[c]||c;}
    function displayName(f){if(appLanguage!=='en')return f.name;var base=f.kind==='parking'?'Parking facility':f.kind==='shower'?'Shower facility':f.kind==='toilet'?'Public restroom':f.kind==='attraction'?'Tourist attraction':f.kind==='tree'?'Street tree':f.category==='그늘'?'Shaded area':f.name;return base;}
    function setMapLanguage(lang){appLanguage=lang;localStorage.setItem('badaEodiLang',lang);document.documentElement.lang=lang;var t=mapCopy[lang],brand=document.querySelector('.brand');brand.innerHTML='<img src="assets/bada-eodi-logo.svg" alt=""><div><small>BUSAN MARINE TOURISM</small><strong>'+ (lang==='en'?'Bada Eodi':'바다어디') +'</strong></div>';document.querySelector('#locate').textContent=t.locate;document.querySelector('.plan-toggle').textContent=t.plan;document.querySelectorAll('.map-language button').forEach(b=>b.classList.toggle('active',b.dataset.mapLang===lang));document.querySelectorAll('.section-title')[0].textContent=t.choose;document.querySelectorAll('.section-title')[1].textContent=t.info;document.querySelector('[data-place="haeundae"]').textContent=lang==='en'?'Haeundae':'해운대';document.querySelector('[data-place="gwangalli"]').textContent=lang==='en'?'Gwangalli':'광안리';document.querySelector('#search').placeholder=t.search;document.querySelector('.shade-card strong').textContent=t.shade;document.querySelector('.gate-box h2').textContent=lang==='en'?'Where would you like to go?':'어디로 떠나볼까?';document.querySelector('.place-choice.gwangalli strong').textContent=lang==='en'?'Gwangalli':'광안리';document.querySelector('.place-choice.haeundae strong').textContent=lang==='en'?'Haeundae':'해운대';buildChips();buildPlanner();}
    function haversine(a,b){var r=6371,la=a[0]*Math.PI/180,lb=b[0]*Math.PI/180,dl=(b[0]-a[0])*Math.PI/180,do_=(b[1]-a[1])*Math.PI/180;var h=Math.sin(dl/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(do_/2)**2;return 2*r*Math.asin(Math.sqrt(h));}
    function buildPlanner(){var t=mapCopy[appLanguage],panel=document.querySelector('#itineraryPanel');var parks=POINTS.filter(p=>p.site===place&&p.kind==='parking'),attractions=POINTS.filter(p=>p.site===place&&p.kind==='attraction');panel.innerHTML='<h3>'+t.planTitle+'</h3><p>'+t.planLead+'</p><label>'+t.parking+'</label><select id="planParking">'+parks.map((p,i)=>'<option value="'+i+'">'+displayName(p)+(appLanguage==='en'?' '+(i+1):'')+'</option>').join('')+'</select><label>'+t.destination+'</label><select id="planDestination"><option value="beach">'+(appLanguage==='en'?(place==='haeundae'?'Haeundae Beach':'Gwangalli Beach'):(place==='haeundae'?'해운대 해수욕장':'광안리 해수욕장'))+'</option>'+attractions.map((p,i)=>'<option value="a'+i+'">'+displayName(p)+'</option>').join('')+'</select><div class="plan-actions"><button class="plan-build" id="planBuild">'+t.build+'</button><button class="plan-cancel" id="planCancel">'+t.cancel+'</button></div><div class="plan-result" id="planResult" hidden></div>';document.querySelector('#planBuild').onclick=()=>{var parking=parks[Number(document.querySelector('#planParking').value)],v=document.querySelector('#planDestination').value,dest=v==='beach'?{point:SITES[place].center}:attractions[Number(v.slice(1))];if(plannedRoute)map.removeLayer(plannedRoute);plannedRoute=L.polyline([parking.point,dest.point,parking.point],{color:'#087eaf',weight:5,opacity:.86,dashArray:'10 8'}).addTo(map);var km=haversine(parking.point,dest.point)*2,mins=Math.max(1,Math.round(km/4.5*60));var result=document.querySelector('#planResult');result.hidden=false;result.innerHTML='<b>'+t.distance+': '+km.toFixed(1)+' km</b><br>'+t.time+': '+mins+' min<br><span>'+t.notice+'</span>';map.fitBounds(plannedRoute.getBounds(),{padding:[70,70]});};document.querySelector('#planCancel').onclick=()=>{if(plannedRoute){map.removeLayer(plannedRoute);plannedRoute=null;}document.querySelector('#planResult').hidden=true;};}

    var originalShowDetail=showDetail;showDetail=function(f){if(appLanguage!=='en')return originalShowDetail(f);var shade=Boolean(f.height),kind=f.kind==='shower'?'Shower':f.kind==='toilet'?'Restroom':f.kind==='parking'?'Parking':f.kind==='attraction'?'Attraction':f.kind==='tree'?'Street tree':'Shade';document.querySelector('#detail').hidden=false;document.querySelector('#detail').innerHTML='<div class="detail-top"><div><h2>'+displayName(f)+'</h2><span class="tag">'+kind+'</span></div><button class="close" aria-label="Close">×</button></div><div class="info"><div><span>Status</span><strong>'+(shade?'Shade estimate shown':'Location shown')+'</strong></div><div><span>'+(shade?'Height':'Fee')+'</span><strong>'+(shade?f.height+'m':f.fee||'Free')+'</strong></div><div><span>Distance</span><strong>Check with your location</strong></div><div><span>Walking time</span><strong>Routing API needed</strong></div></div><button class="route">Directions coming soon</button><p class="note">Facility information collected by the team.</p>';document.querySelector('.close').onclick=()=>document.querySelector('#detail').hidden=true;};

    async function requestWalkingRoute(from,to){const key=window.BADA_EODI_KAKAO_REST_KEY;if(!key)throw new Error('API key is missing.');const params=new URLSearchParams({origin:`${from[1]},${from[0]}`,destination:`${to[1]},${to[0]}`,priority:'DISTANCE',summary:'false'}),response=await fetch(`https://apis-navi.kakaomobility.com/affiliate/walking/v1/directions?${params}`,{headers:{Authorization:`KakaoAK ${key}`,service:'bada-eodi-demo',accept:'application/json'}}),data=await response.json();if(!response.ok||data.routes?.[0]?.result_code!==0)throw new Error(data.routes?.[0]?.result_message||data.msg||`API request failed (${response.status})`);const route=data.routes[0],path=route.sections.flatMap(section=>section.roads.flatMap(road=>{const points=[];for(let i=0;i<road.vertexes.length;i+=2)points.push([road.vertexes[i+1],road.vertexes[i]]);return points;}));return{path,distance:route.summary.distance,duration:route.summary.duration};}
    document.addEventListener('click',async event=>{const button=event.target.closest('#planBuild');if(!button)return;event.preventDefault();event.stopImmediatePropagation();const panel=document.querySelector('#itineraryPanel'),result=document.querySelector('#planResult'),parks=POINTS.filter(p=>p.site===place&&p.kind==='parking'),attractions=POINTS.filter(p=>p.site===place&&p.kind==='attraction'),parking=parks[Number(document.querySelector('#planParking').value)],value=document.querySelector('#planDestination').value,destination=value==='beach'?{point:SITES[place].center}:attractions[Number(value.slice(1))];button.disabled=true;button.textContent=appLanguage==='en'?'Finding route...':'길 찾는 중...';try{const [outbound,returning]=await Promise.all([requestWalkingRoute(parking.point,destination.point),requestWalkingRoute(destination.point,parking.point)]);if(window.badaRouteLayer)map.removeLayer(window.badaRouteLayer);window.badaRouteLayer=L.polyline([...outbound.path,...returning.path],{color:'#087eaf',weight:5,opacity:.9}).addTo(map);const meters=outbound.distance+returning.distance,seconds=outbound.duration+returning.duration;result.hidden=false;result.innerHTML=appLanguage==='en'?`<b>Walking distance: ${(meters/1000).toFixed(1)} km</b><br>Estimated walking time: ${Math.ceil(seconds/60)} min<br><span>Route powered by Kakao Mobility Walking Directions.</span>`:`<b>도보 거리: ${(meters/1000).toFixed(1)} km</b><br>예상 도보 시간: ${Math.ceil(seconds/60)}분<br><span>카카오모빌리티 도보 길찾기 경로입니다.</span>`;map.fitBounds(window.badaRouteLayer.getBounds(),{padding:[70,70]});}catch(error){result.hidden=false;result.innerHTML=appLanguage==='en'?`<b>Walking route could not be loaded.</b><br><span>${error.message}</span>`:`<b>도보 경로를 불러오지 못했습니다.</b><br><span>${error.message}</span>`;}finally{button.disabled=false;button.textContent=appLanguage==='en'?'Build route':'경로 만들기';}},true);
