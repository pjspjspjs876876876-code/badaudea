      const en=language()==='en',steps=Math.round(meters/.7);
      summary.innerHTML=`<div class="route-summary-top"><div><h3>${en?'Route tracking':'현재 위치에서 경로 안내'}</h3><p>${en?`My location → ${destinationName}`:`내 위치 → ${destinationName}`}</p></div><button class="close" id="routeSummaryClose" aria-label="${en?'Close':'닫기'}">×</button></div><div class="route-summary-grid"><div><span>${en?'Distance':'도보 거리'}</span><strong>${(meters/1000).toFixed(1)} km</strong></div><div><span>${en?'Steps':'예상 걸음 수'}</span><strong>${steps.toLocaleString()}${en?'':'걸음'}</strong></div><div><span>${en?'Time':'예상 도보시간'}</span><strong>${minutes}${en?' min':'분'}</strong></div></div><button class="route-summary-cancel" id="routeSummaryCancel">${en?'Cancel route':'경로 취소'}</button>`;
      summary.hidden=false;window.activeRouteSummary=summary;
      const guideButton=document.querySelector('.plan-toggle');guideButton.classList.add('has-active-route');guideButton.textContent=en?'Route guide':'경로 안내';guideButton.title=en?'Open the current route guide':'현재 경로 안내 다시 열기';
      summary.querySelector('#routeSummaryClose').onclick=()=>summary.hidden=true;
      summary.querySelector('#routeSummaryCancel').onclick=()=>{clearRoutes();summary.hidden=true;};
    }
    function buildBeachPlanner(){
      const panel=document.querySelector('#itineraryPanel');if(!panel)return;
      const parks=POINTS.filter(point=>point.site===place&&point.kind==='parking'),destinations=tripDestinations(),beach=BEACHES[place],en=language()==='en';
      const recommendation=(beachSelected,destination)=>{if(!beachSelected)return en?'A foot-wash stop is suggested only when a beach is selected.':'해수욕장을 선택하면 이후에 가까운 세족장·샤워실을 추천합니다.';const stop=recommendedStop(beach,destination||parks[0]);return stop?(en?`Recommended after the beach: ${stop.kind==='shower'?'Shower facility':'Foot wash facility'}`:`해수욕장 다음 추천: ${stop.name}`):(en?'No foot-wash or shower location has been added yet.':'세족장 또는 샤워시설 좌표가 아직 없습니다.');};
      const todayDestination=weatherRecommendedDestination(destinations,beach),todayStop=todayDestination&&recommendedStop(beach,todayDestination),todayCourse=todayDestination&&todayStop?(en?`${beach.nameEn} → ${todayStop.kind==='shower'?'Shower facility':'Foot wash facility'} → ${todayDestination.name}`:`${beach.name} → ${todayStop.name} → ${todayDestination.name}`):'';
      const rainyCourse=weatherState.loaded&&weatherState.raining&&todayDestination?(en?displayName(todayDestination):todayDestination.name):todayCourse;
      panel.innerHTML=`<h3>${en?'Beach day planner':'해안 관광 하루 코스'}</h3><section class="today-course"><b>${en?"Today's recommended course":"오늘의 추천 코스"}</b><p>${rainyCourse||message('추천할 장소를 준비 중입니다.','Preparing a suggested course.')}<br>${weatherRecommendationReason()}</p></section><p>${en?'Set your own route below.':'아래에서 원하는 코스를 직접 선택해 보세요.'}</p><label>${en?'Starting parking':'출발 주차장'}</label><select id="planParking">${parks.map((point,index)=>`<option value="${index}">${en?'Parking ':''}${en?index+1:point.name}</option>`).join('')}</select><label>${en?'Beach':'해수욕장'}</label><select id="planBeach"><option value="none">${en?'Skip':'선택 안 함'}</option><option value="beach">${en?beach.nameEn:beach.name}</option></select><label>${en?'Place to visit':'들르고 싶은 관광지 또는 카페'}</label><select id="planDestination"><option value="none">${en?'Skip':'선택 안 함'}</option>${destinations.map((point,index)=>`<option value="${index}">${en?displayName(point):point.name}</option>`).join('')}</select><div class="plan-recommendation" id="planRecommendation">${recommendation(false,null)}</div><div class="plan-actions"><button class="plan-build" id="planBuild">${en?'Build route':'경로 만들기'}</button><button class="plan-cancel" id="planCancel">${en?'Clear route':'경로 취소'}</button></div><div class="plan-result" id="planResult" hidden></div>`;
      const updateRecommendation=()=>{const beachSelected=document.querySelector('#planBeach').value==='beach',value=document.querySelector('#planDestination').value,destination=value==='none'?null:destinations[Number(value)];document.querySelector('#planRecommendation').textContent=recommendation(beachSelected,destination);};
      document.querySelector('#planBeach').addEventListener('change',updateRecommendation);
      document.querySelector('#planDestination').addEventListener('change',updateRecommendation);
    }
    const previousShowDetail=showDetail;
    showDetail=function(f){
      previousShowDetail(f);
      window.lastDetailFacility=f;
      const detail=document.querySelector('#detail'),detailKey=f.point?.join(',')||f.name;
      detail.dataset.facilityKey=detailKey;
      const routeButton=document.querySelector('#detail .route');
      if(routeButton&&f.point){routeButton.dataset.lat=f.point[0];routeButton.dataset.lng=f.point[1];routeButton.textContent=message('경로 추적','Track route');}
      const extraInfo=language()==='en'?(f.infoEn||f.info):f.info;
      if(extraInfo)document.querySelector('#detail').insertAdjacentHTML('beforeend',`<p class="note facility-extra-info">${extraInfo}</p>`);
      if(f.kind==='cafe'||f.kind==='starbucks'){
        const tag=document.querySelector('#detail .tag');if(tag)tag.textContent=language()==='en'?'Cafe':'카페';
        document.querySelector('#detail .info')?.remove();
        document.querySelector('#detail .facility-extra-info')?.remove();
        document.querySelector('#detail .route + .note')?.remove();
        const menu=language()==='en'?(f.menuEn||f.menu):f.menu;
        const rows=(menu||[]).map(([name,price])=>`<div class="menu-item"><span>${name}</span><b>${price}</b></div>`).join('');
        document.querySelector('#detail .route')?.insertAdjacentHTML('beforebegin',`<div class="info facility-travel-info"><div><span>${message('거리','Distance')}</span><strong>－</strong></div><div><span>${message('예상 도보시간','Estimated walking time')}</span><strong>－</strong></div></div><section class="menu-board"><h3>${language()==='en'?'Featured menu':'대표 메뉴'}</h3>${rows}</section>`);
      }
      const travelInfo=detail.querySelector('.facility-travel-info')||detail.querySelector('.info'),distanceField=travelInfo?.children[travelInfo.classList.contains('facility-travel-info')?0:2]?.querySelector('strong'),timeField=travelInfo?.children[travelInfo.classList.contains('facility-travel-info')?1:3]?.querySelector('strong');
      if(distanceField&&timeField){
        if(!currentPosition||!f.point){
          distanceField.textContent=message('현재 위치 설정 필요','Set your location');
          timeField.textContent=message('현재 위치 설정 필요','Set your location');
        }else{
          distanceField.textContent=message('계산 중…','Calculating…');
          timeField.textContent=message('계산 중…','Calculating…');
          window.badaEodiFootRoute(currentPosition,f.point).then(route=>{
            if(detail.dataset.facilityKey!==detailKey)return;
            distanceField.textContent=`${(route.distance/1000).toFixed(1)} km`;
            timeField.textContent=`${Math.max(1,Math.ceil(route.duration/60))}${language()==='en'?' min':'분'}`;
          }).catch(()=>{
            if(detail.dataset.facilityKey!==detailKey)return;
            distanceField.textContent=message('계산 실패','Unavailable');
            timeField.textContent=message('계산 실패','Unavailable');
          });
        }
      }
    };

    function showCurrentPosition(point,label){
      currentPosition=point;
      if(userMarker)map.removeLayer(userMarker);
      userMarker=L.circleMarker(point,{radius:9,color:'#fff',weight:3,fillColor:'#ef4937',fillOpacity:1})
        .addTo(map).bindTooltip(label||message('내 위치','My location'),{permanent:true,direction:'top'});
      if(window.lastDetailFacility&&!document.querySelector('#detail').hidden)showDetail(window.lastDetailFacility);
    }
    window.setCurrentLocation=showCurrentPosition;

    async function valhallaWalkingRoute(from,to){
      const response=await fetch('https://valhalla1.openstreetmap.de/route',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({locations:[{lat:from[0],lon:from[1]},{lat:to[0],lon:to[1]}],costing:'pedestrian',units:'kilometers'})
      });
      if(!response.ok)throw new Error(`walking server ${response.status}`);
      const data=await response.json(),trip=data.trip;
      if(!trip?.geometry)throw new Error('route data is unavailable');
      return {path:decodePolyline(trip.geometry,6),distance:trip.summary.length*1000,duration:trip.summary.time};
    }
    function decodePolyline(encoded,precision){
      let index=0,lat=0,lng=0,points=[],factor=Math.pow(10,precision);
      while(index<encoded.length){
        let value=0,shift=0,byte;
        do{byte=encoded.charCodeAt(index++)-63;value|=(byte&31)<<shift;shift+=5;}while(byte>=32);
        lat+=(value&1)?~(value>>1):(value>>1);value=0;shift=0;
        do{byte=encoded.charCodeAt(index++)-63;value|=(byte&31)<<shift;shift+=5;}while(byte>=32);
        lng+=(value&1)?~(value>>1):(value>>1);points.push([lat/factor,lng/factor]);
      }
      return points;
    }
    async function osrmFootFallback(from,to){
      const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
      const response=await fetch(url),data=await response.json(),route=data.routes?.[0];
      if(!response.ok||!route)throw new Error('walking server is unavailable');
      return {path:route.geometry.coordinates.map(([lng,lat])=>[lat,lng]),distance:route.distance,duration:route.duration};
    }
    window.badaEodiFootRoute=async(from,to)=>{
      try{return await valhallaWalkingRoute(from,to);}
      catch(firstError){try{return await osrmFootFallback(from,to);}catch(secondError){throw new Error(message('보행 경로 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.','Could not connect to the walking-route server. Please try again.'));}}
    };
    function highlightCourse(points){
      if(!window.courseHighlightLayer)window.courseHighlightLayer=L.layerGroup().addTo(map);
      window.courseHighlightLayer.clearLayers();
      points.forEach((item,index)=>{
        const marker=L.marker(item.point,{zIndexOffset:1000,icon:L.divIcon({className:'',html:`<div class="course-highlight-marker">${index+1}</div>`,iconSize:[40,40],iconAnchor:[20,20]})}).bindTooltip(language()==='en'?(item.nameEn||displayName(item)):item.name,{direction:'top',offset:[0,-18]});
        marker.on('click',()=>{
          const facility=FACILITIES.find(candidate=>candidate.point&&Math.abs(candidate.point[0]-item.point[0])<1e-7&&Math.abs(candidate.point[1]-item.point[1])<1e-7);
          if(facility)showDetail(facility);
        }).addTo(window.courseHighlightLayer);
      });
    }
    function offsetRoute(path,meters){
      return path.map((point,index)=>{const previous=path[Math.max(0,index-1)],next=path[Math.min(path.length-1,index+1)],latitude=point[0]*Math.PI/180,north=(next[0]-previous[0])*111320,east=(next[1]-previous[1])*111320*Math.cos(latitude),length=Math.hypot(east,north)||1,offsetEast=-north/length*meters,offsetNorth=east/length*meters;return[point[0]+offsetNorth/111320,point[1]+offsetEast/(111320*Math.cos(latitude))];});
    }
    function showDirectionArrows(path,type='outbound',reset=true){
      if(!window.routeArrowLayer)window.routeArrowLayer=L.layerGroup().addTo(map);
      if(reset)window.routeArrowLayer.clearLayers();
      if(path.length<3)return;
      const interval=Math.max(2,Math.floor(path.length/12));
      for(let index=interval;index<path.length-1;index+=interval){
        const from=path[index],to=path[Math.min(index+2,path.length-1)],lat1=from[0]*Math.PI/180,lat2=to[0]*Math.PI/180,deltaLng=(to[1]-from[1])*Math.PI/180;
        const bearing=(Math.atan2(Math.sin(deltaLng)*Math.cos(lat2),Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(deltaLng))*180/Math.PI+360)%360;
        L.marker(from,{interactive:false,zIndexOffset:900,icon:L.divIcon({className:'',html:`<div class="route-direction-arrow ${type}" style="transform:rotate(${bearing-90}deg)">➤</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(window.routeArrowLayer);
      }
    }
    function clearRoutes(){
      ['badaRouteLayer','singleRouteLayer'].forEach(key=>{if(window[key]){map.removeLayer(window[key]);window[key]=null;}});
      if(window.courseHighlightLayer)window.courseHighlightLayer.clearLayers();
      if(window.routeArrowLayer)window.routeArrowLayer.clearLayers();
      const result=document.querySelector('#planResult');if(result)result.hidden=true;
      const summary=document.querySelector('#routeSummary');if(summary)summary.hidden=true;
      window.activeRouteSummary=null;
      const guideButton=document.querySelector('.plan-toggle');if(guideButton){guideButton.classList.remove('has-active-route');guideButton.textContent=message('하루 경로','Day route');guideButton.removeAttribute('title');}
    }
    document.querySelector('#locate').onclick=()=>navigator.geolocation?.getCurrentPosition(position=>{
      showCurrentPosition([position.coords.latitude,position.coords.longitude]);map.flyTo(currentPosition,16);
    },()=>alert(message('브라우저에서 위치 권한을 허용해 주세요. 또는 지도에서 마우스 오른쪽 버튼을 눌러 임의 위치를 설정할 수 있어요.','Allow location permission in your browser, or right-click the map to set a demo location.')));
    map.on('contextmenu',event=>{
      showCurrentPosition([event.latlng.lat,event.latlng.lng],message('임의로 설정한 현재 위치','Demo location'));
      alert(message('이 지점을 현재 위치로 설정했어요. 시설을 눌러 길찾기를 해 보세요.','This point is now your location. Select a facility to find a route.'));
    });
    const refreshBeachPlanner=()=>setTimeout(()=>{const panel=document.querySelector('#itineraryPanel');if(panel&&!panel.hidden)buildBeachPlanner();},0);
    document.querySelector('.plan-toggle').addEventListener('click',refreshBeachPlanner);
    document.querySelectorAll('.place,.map-language button').forEach(button=>button.addEventListener('click',refreshBeachPlanner));

    window.addEventListener('click',async event=>{
      const guideToggle=event.target.closest('.plan-toggle');
      if(guideToggle&&(window.badaRouteLayer||window.singleRouteLayer)&&window.activeRouteSummary){
        event.preventDefault();event.stopPropagation();
        document.querySelector('#itineraryPanel').hidden=true;
        window.activeRouteSummary.hidden=!window.activeRouteSummary.hidden;
        return;
      }
      const build=event.target.closest('#planBuild'),cancel=event.target.closest('#planCancel');
      if(cancel){event.preventDefault();event.stopPropagation();clearRoutes();return;}
      if(!build)return;
      event.preventDefault();event.stopPropagation();
      const parks=POINTS.filter(p=>p.site===place&&p.kind==='parking'),destinations=tripDestinations();
      const parking=parks[Number(document.querySelector('#planParking').value)],beachSelected=document.querySelector('#planBeach').value==='beach',beach=beachSelected?BEACHES[place]:null,destinationValue=document.querySelector('#planDestination').value,destination=destinationValue==='none'?null:destinations[Number(destinationValue)],stop=beach?recommendedStop(beach,destination||parking):null,result=document.querySelector('#planResult');
      if(!beach&&!destination){result.hidden=false;result.innerHTML=`<b>${message('해수욕장이나 관광지·카페 중 한 곳 이상을 선택해 주세요.','Choose at least a beach, attraction, or cafe.')}</b>`;return;}
      build.disabled=true;build.textContent=message('길 찾는 중...','Finding route...');
      try{
        const course=[parking,...(beach?[beach]:[]),...(stop?[stop]:[]),...(destination?[destination]:[]),parking],legs=await Promise.all(course.slice(0,-1).map((point,index)=>window.badaEodiFootRoute(point.point,course[index+1].point))),returning=legs.at(-1);
        const outboundPath=legs.slice(0,-1).flatMap(leg=>leg.path),returnPath=offsetRoute(returning.path,3);
        clearRoutes();window.badaRouteLayer=L.featureGroup([L.polyline(outboundPath,routeStyle),L.polyline(returnPath,{...routeStyle,color:'#e25a4f'})]).addTo(map);showDirectionArrows(outboundPath,'outbound',true);showDirectionArrows(returnPath,'returning',false);
        highlightCourse(course.slice(0,-1));
        const meters=legs.reduce((sum,leg)=>sum+leg.distance,0),minutes=Math.ceil(legs.reduce((sum,leg)=>sum+leg.duration,0)/60);
        document.querySelector('#itineraryPanel').hidden=true;
        showRouteSummary({meters,minutes,course:course.slice(0,-1)});
        map.fitBounds(window.badaRouteLayer.getBounds(),{padding:[70,70]});
      }catch(error){result.hidden=false;result.innerHTML=`<b>${message('도보 경로를 불러오지 못했습니다.','Walking route could not be loaded.')}</b><br><span>${error.message}</span>`;}
      finally{build.disabled=false;build.textContent=message('경로 만들기','Build route');}
    },true);

    document.addEventListener('click',async event=>{
      const button=event.target.closest('.route');if(!button)return;
      event.preventDefault();
      const title=document.querySelector('#detail h2')?.textContent||message('선택한 시설','Selected facility');
      const target=button.dataset.lat?{point:[Number(button.dataset.lat),Number(button.dataset.lng)]}:(POINTS.find(point=>point.site===place&&point.name===title)||FACILITIES.find(item=>item.site===place&&item.name===title));
      if(!target?.point)return;
      if(!currentPosition){alert(message('먼저 오른쪽 위 현재 위치 버튼을 눌러 주세요. 위치 권한이 어려우면 지도에서 마우스 오른쪽 버튼을 눌러 임의 위치를 설정할 수 있어요.','Set your location first. If permission is unavailable, right-click the map to set a demo location.'));return;}
      button.disabled=true;button.textContent=message('길 찾는 중...','Finding route...');
      try{
        const route=await window.badaEodiFootRoute(currentPosition,target.point);clearRoutes();window.singleRouteLayer=L.polyline(route.path,routeStyle).addTo(map);showDirectionArrows(route.path);
        const distance=(route.distance/1000).toFixed(1),minutes=Math.ceil(route.duration/60),info=document.querySelector('#detail .info');
        if(info){
          const compact=info.classList.contains('facility-travel-info'),distanceCell=info.children[compact?0:2]?.querySelector('strong'),timeCell=info.children[compact?1:3]?.querySelector('strong');
          if(distanceCell)distanceCell.textContent=`${distance} km`;
          if(timeCell)timeCell.textContent=`${minutes} ${language()==='en'?'min':'분'}`;
        }
        highlightCourse([{point:currentPosition,name:message('내 위치','My location')},{point:target.point,name:title}]);
        document.querySelector('#detail').hidden=true;showLocationRouteSummary({meters:route.distance,minutes,destinationName:title});
        map.fitBounds(window.singleRouteLayer.getBounds(),{padding:[70,70]});
      }catch(error){alert(error.message);}
      finally{button.disabled=false;button.textContent=message('경로 추적','Track route');}
    },true);
    const sidebar=document.querySelector('.sidebar'),sidebarContent=document.createElement('div'),sidebarToggle=document.createElement('button');
    sidebarContent.className='sidebar-content';[...sidebar.childNodes].forEach(node=>sidebarContent.append(node));
    sidebarToggle.type='button';sidebarToggle.className='sidebar-toggle';sidebarToggle.textContent='‹';sidebarToggle.setAttribute('aria-expanded','true');
    sidebar.append(sidebarToggle,sidebarContent);
    const updateSidebarToggle=()=>{const collapsed=sidebar.classList.contains('collapsed');sidebarToggle.textContent=collapsed?'☰':'‹';sidebarToggle.title=collapsed?message('카테고리 화면 열기','Open categories'):message('카테고리 화면 접기','Collapse categories');sidebarToggle.setAttribute('aria-expanded',String(!collapsed));};
    sidebarToggle.onclick=()=>{sidebar.classList.toggle('collapsed');updateSidebarToggle();};
    updateSidebarToggle();
    const placeGate=document.querySelector('#placeGate'),placeGateToggle=document.querySelector('#placeGateToggle'),placeGateClose=document.querySelector('#placeGateClose');
    placeGateToggle.onclick=()=>placeGate.classList.remove('hide');
    placeGateClose.onclick=()=>placeGate.classList.add('hide');
    document.querySelectorAll('.place,[data-entry-place]').forEach(button=>button.addEventListener('click',()=>setTimeout(()=>{if(window.badaRouteLayer||window.singleRouteLayer)clearRoutes();loadWeather();},0)));
    document.querySelectorAll('.map-language button').forEach(button=>button.addEventListener('click',()=>setTimeout(()=>{placeGateToggle.textContent=message('지역 선택','Choose area');placeGateClose.setAttribute('aria-label',message('선택 화면 닫기','Close area selection'));updateSidebarToggle();updateShadeMode();if(weatherState.loaded)drawWeatherWidget();else loadWeather();if(window.activeRouteSummary){const guideButton=document.querySelector('.plan-toggle');guideButton.textContent=message('경로 안내','Route guide');guideButton.title=message('현재 경로 안내 다시 열기','Open the current route guide');}},0)));
    loadWeather();
    setInterval(loadWeather,10*60*1000);
  })();
</script>
